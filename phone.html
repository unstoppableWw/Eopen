<!DOCTYPE html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EOpen 手机传送</title>
<style>*{box-sizing:border-box}body{font:16px system-ui;background:#151515;color:#fafafa;max-width:34rem;margin:auto;padding:28px 20px}h1{font-size:25px}label{display:block;margin:28px 0 9px}textarea,input{width:100%;padding:12px;background:#282828;color:white;border:1px solid #777;border-radius:8px;font:inherit}button{margin:12px 0 0;padding:12px 20px;border:0;border-radius:8px;font:bold 16px system-ui}button:disabled{opacity:.5}p{line-height:1.6}</style>
<h1>EOpen 手机传送</h1><label for="msg">文字或链接</label><textarea id="msg" rows="4" placeholder="粘贴微信里的内容"></textarea><button id="sendText">发送文字</button>
<label for="files">图片、PDF、Word 或其他文件</label><input id="files" type="file" multiple><button id="sendFiles">发送文件</button><p id="status" role="status"></p>
<script>
const el=id=>document.getElementById(id);
function upload(blob,name,type){return new Promise((ok,fail)=>{const x=new XMLHttpRequest();x.open('POST',location.pathname+type+'?name='+encodeURIComponent(name));x.upload.onprogress=e=>{if(e.lengthComputable)el('status').textContent=name+' · '+Math.round(100*e.loaded/e.total)+'%'};x.onload=()=>x.status===201?ok():fail(Error(x.responseText||'传送失败'));x.onerror=()=>fail(Error('连接中断，请确认电脑接收窗口仍然打开'));x.send(blob)})}
async function send(text){const buttons=[el('sendText'),el('sendFiles')];buttons.forEach(b=>b.disabled=true);let count=0;try{if(text){const value=el('msg').value;if(!value.trim())throw Error('请先输入文字或链接');await upload(new Blob([value],{type:'text/plain;charset=utf-8'}),'文字.txt','text');count++;el('msg').value=''}else{const files=Array.from(el('files').files);if(!files.length)throw Error('请先选择文件');for(const file of files){if(file.size>512*1024*1024)throw Error('单个文件限 512 MB');await upload(file,file.name,'file');count++}el('files').value=''}el('status').textContent='电脑已收到 '+count+' 项'}catch(e){el('status').textContent=(count?'已收到 '+count+' 项。':'')+e.message}finally{buttons.forEach(b=>b.disabled=false)}}
el('sendText').onclick=()=>send(true);el('sendFiles').onclick=()=>send(false);
</script></html>
